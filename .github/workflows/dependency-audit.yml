# Weekly dependency vulnerability audit
#
# Runs every Monday at 09:00 UTC and can be triggered manually.
# Uploads a full JSON audit report as an artifact for review.
# Only fails the job on CRITICAL vulnerabilities.

name: Dependency Audit

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

env:
  NODE_ENV: test
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate full audit report
        # Always exits 0 so the artifact is always uploaded
        run: npm audit --json > audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report-${{ github.run_id }}
          path: audit-report.json
          retention-days: 30

      - name: Fail on critical vulnerabilities
        # Only critical severity blocks the pipeline
        run: npm audit --audit-level=critical
